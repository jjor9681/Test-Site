<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340352"/>
      <stop offset="60%" stop-color="#4a1284"/>
      <stop offset="100%" stop-color="#3b0d68"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7b8ff" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#d7b8ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f0e4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d7b8ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b697ff" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#c8a8ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c8a8ff" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="28" height="28" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="url(#glow)"/>
      <rect x="14" width="6" height="28" fill="url(#glow2)"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#base)"/>
  <rect width="256" height="256" fill="url(#stripes)" opacity="0.75"/>
</svg>
