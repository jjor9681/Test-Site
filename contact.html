  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Poppins", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Ubuntu", "Cantarell", "Noto Sans", "Helvetica Neue", "Arial", "sans-serif"] },

            brand: {

              100: "#e7ecd9",
              200: "#cfd9b8",
              300: "#b5c596",
              400: "#9cb279",
              500: "#87a96b",
              600: "#6b8e4e",
              700: "#4e6e3a",

            celestial: "#FFD700",
            sage: "#87A96B",
            sageDark: "#6B8E4E"

  </script>
  <style>
    .gradient-flow { position:absolute; background: linear-gradient(120deg, #0ea5e9, #6366f1, #1e3a8a, #22d3ee, #0ea5e9); background-size:300% 300%; animation: gradientFlow 8s ease-in-out infinite; overflow:hidden; }
    .gradient-flow::before, .gradient-flow::after { content:""; position:absolute; inset:-20% -10% -10% -20%; pointer-events:none; background: radial-gradient(60% 40% at 20% 10%, rgba(34,211,238,.18) 0%, rgba(34,211,238,0) 60%), radial-gradient(50% 35% at 80% 30%, rgba(96,165,250,.16) 0%, rgba(96,165,250,0) 60%), radial-gradient(55% 40% at 30% 80%, rgba(129,140,248,.14) 0%, rgba(129,140,248,0) 60%); filter: blur(12px); animation: floatA 9s ease-in-out infinite alternate; }
    .gradient-flow::after { inset:-10% -20% -20% -10%; background: radial-gradient(45% 30% at 70% 70%, rgba(56,189,248,.14) 0%, rgba(56,189,248,0) 60%), radial-gradient(40% 30% at 25% 55%, rgba(59,130,246,.12) 0%, rgba(59,130,246,0) 60%); filter: blur(22px); animation: floatB 10s ease-in-out infinite alternate-reverse; }
    @keyframes gradientFlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes floatA { 0%{transform:translate3d(-2%,-2%,0) scale(1)} 50%{transform:translate3d(2%,1%,0) scale(1.02)} 100%{transform:translate3d(3%,3%,0) scale(1.04)} }
    @keyframes floatB { 0%{transform:translate3d(2%,1%,0) scale(1)} 50%{transform:translate3d(-1%,-2%,0) scale(1.03)} 100%{transform:translate3d(-3%,-3%,0) scale(1.05)} }
    .glint-overlay::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 100%); transform:translateY(-120%); }
    .animate-glint.glint-overlay::before { animation: glintSweep 1.1s ease-out forwards; }
    @keyframes glintSweep { 0%{transform:translateY(-120%)} 100%{transform:translateY(120%)} }
    .animate-wave-1 { animation: waveSlide 18s linear infinite; }
    .animate-wave-2 { animation: waveSlide 12s linear infinite reverse; }
    .animate-wave-3 { animation: waveSlide 24s linear infinite; opacity:.7 }
    @keyframes waveSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  </style>
</head>
<body class="font-sans bg-slate-950 text-slate-100 antialiased">
  <nav class="fixed inset-x-0 top-0 z-50 border-b border-blue-400/20 bg-blue-900/60 backdrop-blur relative overflow-visible">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between py-2">
        <a href="index.html" class="flex items-center gap-2 font-semibold text-white">
          <span class="h-2.5 w-2.5 rounded-full bg-blue-400"></span>
          <span>Callie Madson</span>
        </a>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-3 sm:gap-4 text-sm">
          <a href="examples.html" class="text-blue-100/80 hover:text-white hover:bg-white/10 rounded-full px-3 py-1.5 transition">Examples</a>
          <a href="shop.html" class="text-blue-100/80 hover:text-white hover:bg-white/10 rounded-full px-3 py-1.5 transition">Shop</a>
          <a href="about.html" class="text-blue-100/80 hover:text-white hover:bg-white/10 rounded-full px-3 py-1.5 transition">About</a>
          <a href="projects.html" class="text-blue-100/80 hover:text-white hover:bg-white/10 rounded-full px-3 py-1.5 transition">Projects</a>

        </div>
      </div>
    </div>
    <div id="nav-wave" class="pointer-events-none absolute left-0 right-0 top-full h-7 sm:h-9">
      <svg class="absolute top-0 left-0 w-[200%] min-w-[200%] h-full animate-wave-1" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <defs><linearGradient id="wave1-c" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/><stop offset="50%" stop-color="#22d3ee" stop-opacity="0.30"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/></linearGradient></defs>
        <path d="M0 60 Q 120 0 240 60 T 480 60 T 720 60 T 960 60 T 1200 60 T 1440 60 V120 H0 Z" fill="url(#wave1-c)"/>
      </svg>
      <svg class="absolute top-0 left-0 w-[200%] min-w-[200%] h-full animate-wave-2" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <defs><linearGradient id="wave2-c" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.35"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.45"/></linearGradient></defs>
        <path d="M0 65 Q 160 20 320 65 T 640 65 T 960 65 T 1280 65 T 1600 65 V120 H0 Z" fill="url(#wave2-c)"/>
      </svg>
      <svg class="absolute top-0 left-0 w-[200%] min-w-[200%] h-full animate-wave-3" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <defs><linearGradient id="wave3-c" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/><stop offset="50%" stop-color="#06b6d4" stop-opacity="0.18"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.18"/></linearGradient></defs>
        <path d="M0 70 Q 120 35 240 70 T 480 70 T 720 70 T 960 70 T 1200 70 T 1440 70 V120 H0 Z" fill="url(#wave3-c)"/>
      </svg>
    </div>
  </nav>

  <div id="hero-gradient" class="absolute inset-0 -z-10 gradient-flow"></div>
  <div id="hero-glint" class="absolute inset-0 z-10 glint-overlay opacity-0 pointer-events-none"></div>
  <main class="relative pt-40 pb-20 z-20">
    <div id="page-content" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 opacity-0 translate-y-4 transition-all duration-700">
      <h1 class="text-center text-3xl font-bold tracking-tight">Contact</h1>
      <div class="mt-6 text-center">
        <p class="text-slate-300">Let’s work together!</p>
        <a href="mailto:jonasjistheman@gmail.com" class="mt-6 inline-flex items-center justify-center rounded-lg bg-celestial px-5 py-3 font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-yellow-200/60 hover:bg-yellow-300 transition">Email me: jonasjistheman@gmail.com</a>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/10 py-10 text-center text-sm text-slate-400">
    <p>© 2025 Compositions By Callie · All Rights Reserved</p>
  </footer>
  <script>
    window.addEventListener('load', () => {
      const gradient = document.getElementById('hero-gradient');
      const content = document.getElementById('page-content');
      const glint = document.getElementById('hero-glint');
      const reveal = () => {
        if (gradient) gradient.style.animationPlayState = 'paused';
        if (content) { content.classList.remove('opacity-0','translate-y-4'); content.classList.add('opacity-100','translate-y-0'); }
        if (glint) { glint.classList.remove('opacity-0'); glint.classList.add('animate-glint'); setTimeout(()=>glint.classList.add('opacity-0'), 1200); }
      };
      setTimeout(reveal, 1200);
    });
  </script>
</body>
